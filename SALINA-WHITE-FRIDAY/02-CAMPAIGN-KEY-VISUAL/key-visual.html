<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Salina White Friday — Key Visual 1080x1350</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@600;700&display=swap">
<style>
  /* SALINA WHITE FRIDAY — Key Visual (source). Edit text here, re-render with render-key-visual.js */
  :root{
    --pu:#58346F; --pu-dk:#46295A; --pu-in:#3E2350;
    --vi:#A979C0; --or:#F2A34A; --cr:#FFF8EE; --ch:#30263A;
    --ground:#F3E7EF; /* soft violet tint on cream */
  }
  html,body{margin:0;background:#ddd}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cr);font-family:"Tajawal","Cairo",sans-serif}
  .art{position:absolute;inset:0}
  .eyebrow{position:absolute;top:48px;right:86px;display:flex;align-items:center;gap:16px;
    font:700 30px/1 "Tajawal",sans-serif;letter-spacing:7px;color:var(--pu);direction:ltr}
  .eyebrow i{width:14px;height:14px;border-radius:50%;background:var(--or);display:block}
  .headline{position:absolute;top:140px;right:84px;text-align:right;color:var(--pu);font-weight:900}
  .l1{font-size:196px;line-height:1}
  .l2{display:flex;align-items:center;gap:26px;margin-top:6px}
  .fi{font-size:128px;line-height:1;color:var(--ch);font-weight:800}
  .hl{font-size:188px;line-height:1;background:var(--or);color:var(--pu);border-radius:28px;padding:0 30px 12px;transform:rotate(-2.5deg);display:inline-block}
  .logo{position:absolute;right:62px;bottom:46px;width:236px}
  .tag{position:absolute;left:54px;bottom:44px;height:64px;padding:0 30px 0 64px;background:var(--or);color:var(--pu);
    display:flex;align-items:center;font:800 27px/1 "Tajawal",sans-serif;letter-spacing:3px;direction:ltr;
    clip-path:polygon(34px 0,100% 0,100% 100%,34px 100%,0 50%)}
  .tag::before{content:"";position:absolute;left:28px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--cr)}
</style>
</head>
<body>
<div class="stage" id="stage">

  <svg class="art" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- ground circle -->
    <circle cx="450" cy="1010" r="360" fill="var(--ground)"/>

    <!-- ===== OLD SHOPPING: outline only, leaving the frame ===== -->
    <g fill="none" stroke="var(--vi)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- sneaker, left -->
      <g transform="translate(58 738) rotate(-24)">
        <path d="M-95 40V5c0-17 13-25 29-25h36l20 24c20 18 46 24 76 27l26 5c12 2 16 14 12 24H-95z"/>
        <path d="M-95 48h199M-22 10l12-10M-6 18l12-10"/>
      </g>
      <g stroke-dasharray="2 18" opacity=".7"><path d="M185 812q30 14 52 40"/></g>

      <!-- dress on hanger, right -->
      <g transform="translate(1000 700) rotate(14)">
        <path d="M0-102c0-16 15-20 19-9"/>
        <path d="M0-100L-72-62H72z"/>
        <path d="M-30-62H30l-4 42 54 140H-80l54-140z"/>
        <path d="M-27-20h54"/>
      </g>
      <g stroke-dasharray="2 18" opacity=".7"><path d="M880 760q-40 20-58 56"/></g>

      <!-- shopping bag, left low -->
      <g transform="translate(112 1068) rotate(12)">
        <path d="M-28-50v-18c0-28 56-28 56 0v18"/>
        <path d="M-62-50h124l-6 120q-1 10-11 10h-90q-10 0-11-10z"/>
      </g>

      <!-- handbag, right low -->
      <g transform="translate(938 1012) rotate(-11)">
        <path d="M-45-30c0-64 90-64 90 0"/>
        <path d="M-80-30H80q8 0 8 8v82q0 12-12 12H-76q-12 0-12-12v-82q0-8 8-8z"/>
        <rect x="-14" y="-6" width="28" height="20" rx="4"/>
      </g>
      <g stroke-dasharray="2 18" opacity=".7"><path d="M815 1000q-50-6-96 14"/></g>
    </g>

    <!-- ===== THE SALINA BAG ===== -->
    <!-- back wall + handle -->
    <path d="M330 875C330 690 570 690 570 875" fill="none" stroke="var(--pu-in)" stroke-width="22" stroke-linecap="round"/>
    <polygon points="236,860 664,860 652,888 248,888" fill="var(--pu-in)"/>

    <!-- what comes out of it -->
    <!-- laptop -->
    <g transform="translate(318 800) rotate(-18)">
      <rect x="-118" y="-128" width="236" height="230" rx="16" fill="var(--vi)"/>
      <rect x="-102" y="-112" width="204" height="128" rx="8" fill="var(--cr)"/>
      <rect x="-84" y="-94" width="96" height="14" rx="7" fill="var(--pu)"/>
      <rect x="-84" y="-70" width="70" height="9" rx="4.5" fill="var(--vi)"/>
      <rect x="-84" y="-54" width="56" height="9" rx="4.5" fill="var(--vi)"/>
      <circle cx="54" cy="-58" r="28" fill="var(--or)"/>
      <path d="M46-72v28l22-14z" fill="var(--cr)"/>
      <rect x="-84" y="-14" width="168" height="10" rx="5" fill="var(--ground)"/>
      <rect x="-84" y="-14" width="104" height="10" rx="5" fill="var(--or)"/>
    </g>
    <!-- book -->
    <g transform="translate(492 770) rotate(4)">
      <rect x="-66" y="-126" width="132" height="280" rx="10" fill="var(--ch)"/>
      <rect x="-66" y="-126" width="24" height="280" rx="6" fill="#463A52"/>
      <rect x="-26" y="-94" width="72" height="14" rx="7" fill="var(--or)"/>
      <rect x="-26" y="-70" width="52" height="9" rx="4.5" fill="var(--cr)" opacity=".75"/>
      <circle cx="10" cy="-12" r="22" fill="none" stroke="var(--cr)" stroke-width="6" opacity=".75"/>
      <rect x="62" y="-118" width="10" height="264" rx="3" fill="var(--cr)"/>
    </g>
    <!-- light bulb -->
    <g transform="translate(676 702) rotate(18)">
      <g stroke="var(--or)" stroke-width="11" stroke-linecap="round">
        <path d="M0-112v-26"/><path d="M-80-80l-18-18"/><path d="M80-80l18-18"/><path d="M-112-12h-26"/><path d="M112-12h26"/>
      </g>
      <path d="M-74-12a74 74 0 1 1 148 0c0 34-30 50-34 86h-80c-4-36-34-52-34-86z" fill="var(--or)"/>
      <path d="M-42-36a46 46 0 0 1 30-32" fill="none" stroke="var(--cr)" stroke-width="11" stroke-linecap="round"/>
      <rect x="-40" y="80" width="80" height="22" rx="8" fill="var(--pu)"/>
      <rect x="-32" y="106" width="64" height="20" rx="8" fill="var(--pu-dk)"/>
    </g>

    <!-- front of bag -->
    <path d="M228 882H672L646 1222Q644 1250 616 1250H284Q256 1250 254 1222Z" fill="var(--pu)"/>
    <path d="M598 920H669L646 1222Q644 1250 616 1250H592Z" fill="var(--pu-dk)" opacity=".55"/>
    <polygon points="228,882 672,882 669,920 231,920" fill="var(--pu-dk)"/>
    <image href="../01-BRAND-ASSETS/salina-logo-cream.png" x="310" y="985" width="250" height="173"/>
  </svg>

  <div class="eyebrow"><i></i>SALINA WHITE FRIDAY</div>

  <div class="headline">
    <div class="l1">استثمري</div>
    <div class="l2"><span class="fi">في</span><span class="hl">نفسك</span></div>
  </div>

  <img class="logo" src="../01-BRAND-ASSETS/salina-logo-transparent.png" alt="Salina">
  <div class="tag">WHITE FRIDAY</div>
</div>
</body>
</html>
