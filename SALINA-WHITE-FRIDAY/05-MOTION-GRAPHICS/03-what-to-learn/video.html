  #stage > *{position:absolute}

  .m{display:inline-block;overflow:hidden;padding:.12em .04em .2em;margin:-.12em -.04em -.2em}
  .m > span{display:inline-block}

  .card .chip{left:0;right:0;top:650px;display:flex;justify-content:center}

  .card .btn{left:140px;top:1010px;width:620px;height:130px;background:var(--gd);color:var(--pu);
       clip-path:polygon(60px 0,100% 0,100% 100%,60px 100%,0 50%);display:flex;align-items:center;justify-content:center;gap:20px;padding-left:40px;box-sizing:border-box;

<script src="../lib/cta.js"></script>
<script>
const DURATION = 19.9, FPS = 30, CTA0 = 17.55;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { outCubic: p => 1 - (1 - p) ** 3, inCubic: p => p ** 3, inQuad: p => p * p,
  inOutCubic: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
  outBack: (p, s = 1.7) => 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2, outQuint: p => 1 - (1 - p) ** 5 };
const spring = (dt, amp, f = 18, k = 9) => dt < 0 ? 0 : amp * Math.exp(-k * dt) * Math.cos(f * dt);
const tf = (el, x, y, r = 0, s = 1) => el.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${Math.max(s, 1e-4)})`);
const AR = '٠١٢٣٤';
function words(root, tIn, step, t) {
  [...root.querySelectorAll('.m > span')].forEach((s, i) => { const a = E.outCubic(P(t, tIn + i * step, tIn + i * step + .45));
    s.style.transform = `translateY(${(1 - a) * 115}%)`; });
}

/* timing */
const CARD0 = 2.8, CARD = 3.0, SUM = 14.8;
const starts = [0, 1, 2, 3].map(k => CARD0 + k * CARD);
const CART_HDR = { x: 165, y: 350, s: 1.3 }, CART_SUM = { x: 540, y: 960, s: 3.0 };
const SLOTS = [[-44, -42], [-10, -50], [24, -44], [56, -36]];   // where each mini icon sits in the basket
const FLY_FROM = [540, 800];

/* content-writing lines */
const LW = [220, 200, 236, 180, 214, 150];
LW.forEach((w, i) => { const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  Object.entries({ id: 'c0-l' + i, x: -130, y: -112 + i * 44, width: 0, height: 16, rx: 8 }).forEach(([k, v]) => r.setAttribute(k, v)); $('c0-lines').appendChild(r); });

function cartPose(t) {
  const m = E.inOutCubic(P(t, SUM, SUM + .6));
  return { x: lerp(CART_HDR.x, CART_SUM.x, m), y: lerp(CART_HDR.y, CART_SUM.y, m), s: lerp(CART_HDR.s, CART_SUM.s, m) };
}

function renderAt(t) {
  /* ---- hook ---- */
  words($('h1'), .25, .2, t);
  const p2 = P(t, .7, 1.1), p3 = P(t, 1.15, 1.55), out = E.inCubic(P(t, 2.15, 2.5));
  $('h2w').style.transform = `scale(${lerp(1.8, 1, E.outBack(p2, 2.2))})`; $('h2').style.opacity = clamp(p2 * 4);
  $('h3w').style.transform = `translateY(${(1 - E.outBack(p3, 1.8)) * 120}px) rotate(${lerp(6, 0, p3)}deg)`; $('h3').style.opacity = clamp(p3 * 4);
  ['h1', 'h2', 'h3'].forEach((id, i) => { const el = $(id); el.style.translate = `0 ${-140 * out}px`; el.style.scale = String(1 - .3 * out);
    if (out > 0) el.style.opacity = String(1 - out); el.style.visibility = t < 2.55 ? 'visible' : 'hidden'; });
  // teaser icons orbit the question
  [[200, 560], [880, 640], [170, 1240], [900, 1180]].forEach(([x, y], k) => { const q = E.outBack(P(t, 1.4 + k * .1, 1.75 + k * .1), 2.2);
    tf($('te' + k), x + 8 * Math.sin(t * 2.6 + k), y + 10 * Math.cos(t * 2.2 + k), 10 * Math.sin(t * 2 + k), 1.3 * q * (1 - out));
    $('te' + k).style.display = t < 2.55 ? '' : 'none'; });

  /* ---- header ---- */
  const hh = E.outCubic(P(t, 2.35, 2.8)), hide = P(t, SUM, SUM + .3);
  $('hq').style.opacity = hh * (1 - hide); $('hq').style.translate = `0 ${(1 - hh) * -40}px`;
  $('eb').style.opacity = P(t, 2.3, 2.6);

  /* ---- cart ---- */
  const cp = cartPose(t), drop = E.outBack(P(t, 2.45, 2.85), 1.6);
  let arrived = 0; starts.forEach(s => { if (t >= s + 2.5) arrived++; });
  let bump = 0; starts.forEach(s => { bump += spring(t - (s + 2.5), .14, 20, 9); });
  bump += spring(t - (SUM + .6), .08, 16, 7);
  tf($('cart'), cp.x, cp.y - (1 - drop) * 300, 4 * Math.sin(t * 1.8) * (t > SUM + .6 ? 1 : 0), cp.s * (1 + bump));
  $('cart').style.opacity = clamp(P(t, 2.45, 2.6) * 3);
  $('badgeN').textContent = AR[arrived];
  $('badge').setAttribute('transform', `translate(70 -64) scale(${1 + 3 * Math.max(0, bump)})`);
  [0, 1, 2, 3].forEach(k => { const [sx, sy] = SLOTS[k]; tf($('ic' + k), sx, sy, (k - 1.5) * 10, .5); $('ic' + k).style.display = t >= starts[k] + 2.5 ? '' : 'none'; });

  /* ---- cards ---- */
  starts.forEach((s, k) => {
    const card = $('c' + k), u = t - s;
    const inn = E.outCubic(P(u, 0, .5)), outp = E.inCubic(P(u, 2.62, 3.0));
    card.style.transform = `translateX(${lerp(-1100, 0, inn) + lerp(0, 1150, outp)}px) rotate(${lerp(-4, 0, inn) + lerp(0, 4, outp)}deg)`;
    card.style.visibility = (u > -.05 && u < 3.05) ? 'visible' : 'hidden';
    if (card.style.visibility === 'hidden') return;
    const chip = E.outBack(P(u, .4, .7), 2.4); card.querySelector('.chip span').style.transform = `scale(${chip})`;
    words(card.querySelector('.ttl'), .5, .09, t - s + 0);
    // button: pops, gets tapped, turns into "added"
    const bp = E.outBack(P(u, 1.3, 1.6), 2), tap = (u > 1.85 && u < 1.97) ? .93 : 1 + spring(u - 1.97, .05, 20, 10);
    const btn = card.querySelector('.btn'); btn.style.transform = `scale(${bp * tap})`;
    const added = u >= 1.97;
