<script>
const DURATION = 18.5, FPS = 30;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outCubic: p => 1 - (1 - p) ** 3, inCubic: p => p ** 3, inQuad: p => p * p,
  inOutCubic: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
  outBack: (p, s = 1.7) => 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2,
  outQuint: p => 1 - (1 - p) ** 5,
};
const spring = (dt, amp, f = 18, k = 9) => dt < 0 ? 0 : amp * Math.exp(-k * dt) * Math.cos(f * dt);
const mix = (c1, c2, p) => { const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = h(c1), b = h(c2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], p)).toString(16).padStart(2, '0')).join(''); };
const tf = (el, x, y, r = 0, sx = 1, sy = sx) => el.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);
const css = (el, o) => Object.assign(el.style, o);

/* word-mask reveal: words slide up into place (in) and up out of view (out) */
function words(lineId, tIn, step, tOut, t) {
  const spans = [...$(lineId).querySelectorAll('.m > span')];
  spans.forEach((s, i) => {
    const pin = E.outCubic(P(t, tIn + i * step, tIn + i * step + .45));
    const pout = tOut ? E.inCubic(P(t, tOut + i * .04, tOut + i * .04 + .35)) : 0;
    s.style.transform = `translateY(${(1 - pin) * 115 - pout * 115}%)`;
  });
  $(lineId).style.visibility = (t >= tIn - .01 && (!tOut || t < tOut + .6)) ? 'visible' : 'hidden';
}

/* ---------- layout constants ---------- */
const BAGS = [ // outline shopping bags: x, mouth y, land time
  { id: 'B1', x: 285, y: 1300, tl: .55 }, { id: 'B2', x: 540, y: 1345, tl: 1.0 }, { id: 'B3', x: 795, y: 1300, tl: 1.45 } ];
const ITEMS = [ // item, from bag, pop time, rest x,y,rot, scale
  { id: 'I1', b: 0, tp: 1.75, x: 200, y: 975, r: -12, s: 1.55 },
  { id: 'I2', b: 1, tp: 1.95, x: 545, y: 900, r: 6, s: 1.5 },
  { id: 'I3', b: 2, tp: 2.15, x: 885, y: 985, r: 16, s: 1.5 },
  { id: 'I4', b: 0, tp: 2.35, x: 345, y: 760, r: 10, s: 1.4 },
  { id: 'I5', b: 2, tp: 2.55, x: 760, y: 770, r: -14, s: 1.35 },
  { id: 'I6', b: 1, tp: 2.75, x: 150, y: 700, r: -16, s: 1.15 },
  { id: 'I7', b: 2, tp: 2.95, x: 935, y: 690, r: 12, s: 1.05 },
  { id: 'I8', b: 1, tp: 3.15, x: 655, y: 1085, r: 8, s: 1.1 } ];
const STICKERS = [ { id: 'P1', tp: 2.3, x: 100, y: 1150, r: -14, s: 1.25 }, { id: 'P2', tp: 2.75, x: 985, y: 860, r: 12, s: 1.1 }, { id: 'P3', tp: 3.2, x: 420, y: 1095, r: -6, s: 1.0 } ];
const SPARKS = [ { id: 'K1', x: 470, y: 660, s: .9, ph: 0 }, { id: 'K2', x: 1000, y: 1080, s: .7, ph: 1.3 }, { id: 'K3', x: 80, y: 860, s: .8, ph: 2.1 },
  { id: 'K4', x: 640, y: 1010, s: .6, ph: .7 }, { id: 'K5', x: 260, y: 1120, s: .6, ph: 2.8 } ];
const SB = { x: 540, y: 1180, s: .92 };                 // Salina bag (mouth centre) in scene 2
const LEARN = [ // learning items inside Salina bag, local coords
  { id: 'it-laptop', tp: 7.0, x: -150, y: -70, r: -18, s: 1 },
  { id: 'it-book', tp: 7.3, x: 38, y: -105, r: 5, s: 1 },
  { id: 'it-bulb', tp: 7.6, x: 222, y: -200, r: 16, s: 1 } ];

function renderAt(t) {
  /* ground */
  const g = E.outBack(P(t, .05, .7), 1.2) * (1 - E.inCubic(P(t, 13.6, 14.1)));
  $('ground').setAttribute('r', 450 * g);
  const groundShift = E.inOutCubic(P(t, 9.0, 9.8));
  $('ground').setAttribute('cy', lerp(1330, 1560, groundShift));

  /* ----- scene 1: bags drop, items pop out ----- */
  BAGS.forEach((b, i) => {
    const el = $(b.id);
    const fall = E.inQuad(P(t, b.tl - .38, b.tl));
    let y = lerp(-500, b.y, fall), sx = 1, sy = 1, s = .86, x = b.x;
    if (t >= b.tl) { const sq = spring(t - b.tl, .2); sy = 1 - sq; sx = 1 + sq * .7; }
    // a little hop each time an item leaves this bag
    ITEMS.filter(it => BAGS[it.b] === b).forEach(it => { const d = spring(t - it.tp, .12, 22, 11); sy -= d; sx += d * .6; });
    // scene 2: side bags slide into the middle one and vanish; the middle one grows
    if (i !== 1) { const m = E.inCubic(P(t, 5.15 + i * .05, 5.65 + i * .05)); x = lerp(x, 540, m); y = lerp(y, 1345, m); s *= 1 - m * .9; }
    else { const m = E.inOutCubic(P(t, 5.45, 6.0)); s = lerp(.86, SB.s * 444 / 300, m); y = lerp(y, SB.y, m); }
    // squash about the bag's bottom edge
    el.setAttribute('transform', `translate(${x} ${y + 320 * s}) scale(${s * sx} ${s * sy}) translate(0 -320)`);
    const hidden = t < b.tl - .4 || (i !== 1 && t > 5.75) || (i === 1 && t > 6.9);
    el.style.display = hidden ? 'none' : '';
    if (i === 1) el.style.opacity = 1 - P(t, 6.3, 6.85);
  });

  ITEMS.forEach((it, k) => {
    const el = $(it.id), b = BAGS[it.b];
    const p = P(t, it.tp, it.tp + .62), e = E.outCubic(p);
    let x = lerp(b.x, it.x, e), y = lerp(b.y + 20, it.y, e) - 300 * 4 * p * (1 - p) * .55;
    let r = lerp(-140, it.r, E.outBack(p, 1.3)), s = lerp(.25, it.s, E.outBack(p, 1.6));
    // idle float
    const fl = P(t, it.tp + .6, it.tp + 1.0);
    y += fl * 10 * Math.sin((t * 2 * Math.PI) / 1.7 + k); r += fl * 3 * Math.sin((t * 2 * Math.PI) / 2.1 + k);
    // scene 2: crowd in a little (4.2-4.7), then get pulled into the middle bag one by one
    const crowd = E.inOutCubic(P(t, 4.1, 4.6));
    x = lerp(x, lerp(x, 540, .25), crowd); y = lerp(y, y + 40, crowd);
    const tg = 4.62 + k * .085, gp = E.inCubic(P(t, tg, tg + .42));
    x = lerp(x, 540, gp); y = lerp(y, 1345, gp); s *= 1 - gp * .85; r += gp * 200;
    tf(el, x, y, r, s);
    el.style.display = (t < it.tp || t > tg + .42) ? 'none' : '';
  });

  // discount stickers pop in, spin a little, then get pulled into the bag with the rest
  STICKERS.forEach((k, i) => { const el = $(k.id), p = P(t, k.tp, k.tp + .4);
    let x = k.x, y = k.y + 6 * Math.sin(t * 2.2 + i) * P(t, k.tp + .4, k.tp + .8), r = lerp(-60, k.r, E.outBack(p, 2)) + 4 * Math.sin(t * 1.7 + i);
    let s = k.s * E.outBack(p, 2.4);
    const tg = 5.0 + i * .1, gp = E.inCubic(P(t, tg, tg + .4)); x = lerp(x, 540, gp); y = lerp(y, 1345, gp); s *= 1 - gp * .85; r += gp * 180;
    tf(el, x, y, r, Math.max(s, .0001)); el.style.display = (t < k.tp || t > tg + .4) ? 'none' : ''; });
  // sparkles twinkle while the shopping is at its peak
  SPARKS.forEach(k => { const live = P(t, 2.2, 2.6) * (1 - P(t, 4.4, 4.7));
    const tw = Math.max(0, Math.sin(t * 4.2 + k.ph)) ** 2 * live; tf($(k.id), k.x, k.y, t * 40 + k.ph * 30, Math.max(k.s * tw, .0001));
    $(k.id).style.display = live > 0 ? '' : 'none'; });

  /* ----- scene 2: the middle bag becomes the Salina bag ----- */
  const sb = $('sbag');
  const wipe = E.inOutCubic(P(t, 6.05, 6.85));
  $('wipeRect').setAttribute('y', lerp(400, -260, wipe));
  let sx = SB.x, sy = SB.y, ss = SB.s, sqx = 1, sqy = 1;
  const pulse = spring(t - 6.85, .14, 20, 9); sqy -= pulse; sqx += pulse * .7;
  LEARN.forEach(l => { const d = spring(t - l.tp, .07, 22, 12); sqy -= d; sqx += d * .5; });
  // scene 3: bag settles lower and smaller so the words can take the top
  const down = E.inOutCubic(P(t, 9.0, 9.8));
  sy = lerp(sy, 1500, down); ss = lerp(ss, .8, down);
  sb.setAttribute('transform', `translate(${sx} ${sy + 368 * ss}) scale(${ss * sqx} ${ss * sqy}) translate(0 -368)`);
  sb.style.display = (t < 6.0 || t > 14.2) ? 'none' : '';

  LEARN.forEach((l, i) => {
    const p = P(t, l.tp, l.tp + .55);
    const x = lerp(l.x * .4, l.x, E.outCubic(p)), y = lerp(220, l.y, E.outBack(p, 1.5));
    const fl = P(t, l.tp + .55, l.tp + 1);
    tf($(l.id), x, y + fl * 8 * Math.sin(t * 3.4 + i * 1.7), l.r + fl * 2.5 * Math.sin(t * 2.6 + i), lerp(.6, l.s, E.outCubic(p)));
    $(l.id).style.display = t < l.tp ? 'none' : '';
  });
  // laptop progress bar fills while it is on screen
  $('lap-progress').setAttribute('width', lerp(30, 168, E.inOutCubic(P(t, 7.4, 12.5))));
  // bulb switches on
  const on = P(t, 8.0, 8.25);
  $('glass').setAttribute('fill', mix('#FFF8EE', '#F5C04A', on));
  $('glass').setAttribute('stroke', mix('#A979C0', '#F5C04A', on));
  ['r0', 'r1', 'r2', 'r3', 'r4'].forEach((r, i) => { const q = E.outBack(P(t, 8.05 + i * .04, 8.35 + i * .04), 2);
    const glow = 1 + .12 * Math.sin(t * 6 + i) * P(t, 8.4, 8.8);
    $(r).setAttribute('transform', `translate(0 -12) scale(${Math.max(q * glow, 0.0001)}) translate(0 12)`); $(r).style.opacity = q > 0 ? 1 : 0; });

  /* ----- copy, scene 1 ----- */
  words('s1a', .35, .14, 2.95, t);
  words('s1b', .85, 0, 3.0, t);
  words('s1c', 3.25, .16, 5.7, t);

  /* ----- copy, scene 3 ----- */
  words('s3a', 9.1, .22, 13.4, t);
  [...document.querySelectorAll('.dot')].forEach((d, i) => { const q = E.outBack(P(t, 9.55 + i * .15, 9.8 + i * .15), 3);
    d.style.transform = `scale(${q * (1 - E.inCubic(P(t, 13.4, 13.6)))})`; });
  const inv = $('invest'), ip = P(t, 10.3, 10.75);
  const ins = lerp(1.9, 1, E.outBack(ip, 2.2)) + spring(t - 12.4, .05, 16, 6);
  inv.style.transform = `scale(${ins}) rotate(${lerp(-7, 0, E.outBack(ip, 1.8))}deg)`;
  inv.style.opacity = P(t, 10.3, 10.42) * (1 - P(t, 13.45, 13.7));
  $('s3b').style.visibility = t >= 10.3 ? 'visible' : 'hidden';
  // highlighter swipe under «استثمري» (sized from the word itself)
  const r = inv.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
  const hp = E.outQuint(P(t, 10.55, 10.95)) * (1 - E.inCubic(P(t, 13.4, 13.65)));
  if (ip >= 1) { const w = r.width + 40; css($('hl'), { left: (r.left - st.left - 20) + 'px', top: (r.bottom - st.top - r.height * .42) + 'px', width: w + 'px' }); }
  $('hl').style.transform = `scaleX(${hp}) rotate(-2deg)`; $('hl').style.visibility = hp > 0 ? 'visible' : 'hidden';
  words('s3c', 11.05, .2, 13.4, t);
  const bp = P(t, 11.5, 11.85);
  $('bang').style.transform = `translateY(${lerp(-80, 0, E.outBack(bp, 2.5))}px) rotate(${lerp(-30, 8, E.outBack(bp, 2))}deg) scale(${1 + spring(t - 12.4, .15, 18, 8)})`;
  $('bang').style.opacity = P(t, 11.5, 11.55) * (1 - P(t, 13.4, 13.6));

  /* ----- scene 4: purple circle opens from the bag, identity builds ----- */
  const wp = E.inOutCubic(P(t, 13.45, 14.15)), R = 2300 * wp;
  css($('wipe'), { width: 2 * R + 'px', height: 2 * R + 'px', left: (540 - R) + 'px', top: (1560 - R) + 'px', visibility: wp > 0 ? 'visible' : 'hidden' });
  [...$('s4a').children].forEach((c, i) => { const q = P(t, 14.2 + i * .07, 14.65 + i * .07);
    c.style.transform = `translateY(${lerp(140, 0, E.outBack(q, 1.6))}px)`; c.style.opacity = clamp(q * 3); });
  const wf = E.outCubic(P(t, 14.75, 15.35));
  css($('s4b'), { letterSpacing: lerp(70, 14, wf) + 'px', opacity: wf });
  $('rule').style.transform = `scaleX(${E.outQuint(P(t, 15.1, 15.5))})`;
  words('s4c', 15.45, .18, 0, t);
  words('s4d', 16.0, .16, 0, t);
  const lp = P(t, 16.55, 17.0);
  $('logo').style.transform = `translateY(${spring(t - 17.0, 0) + 6 * Math.sin(t * 2.4) * P(t, 17, 17.5)}px) scale(${lerp(.5, 1, E.outBack(lp, 2))})`;
  $('logo').style.opacity = clamp(lp * 3);
}

/* build SALINA letters once */
'SALINA'.split('').forEach(ch => { const s = document.createElement('span'); s.textContent = ch; s.style.display = 'inline-block'; $('s4a').appendChild(s); });

window.renderAt = renderAt; window.DURATION = DURATION; window.FPS = FPS;
renderAt(0);
if (location.hash === '#play') { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
</body></html>
